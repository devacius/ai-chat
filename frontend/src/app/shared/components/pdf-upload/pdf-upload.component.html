<div class="pdf-upload">
    <input type="file" (change)="onFileSelected($event)" accept="application/pdf" />
    <button (click)="onUpload()">Upload PDF</button>
    <p>{{ uploadStatus }}</p>
  </div>

  <app-toast
  [message]="toastMessage"
  [type]="toastType"
  [show]="showToast">
</app-toast>
